name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 🛠️ PASO CLAVE: Instalar Flutter en la máquina virtual de GitHub
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Ejecutar la limpieza, obtener paquetes y compilar para web
      - run: flutter pub get && flutter build web --release

      # Realizar el despliegue a Firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VITALFITNESS_BC7E7 }}
          projectId: vitalfitness-bc7e7